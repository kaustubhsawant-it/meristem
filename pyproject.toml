[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meristem"
version = "0.3.0"
description = "Meristem — typed atom store and MCP server for Claude Code (formerly DLMS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "Kaustubh Sawant" }]
dependencies = [
    "rich>=13.7",
    "tree-sitter>=0.24",
    "tree-sitter-dart>=0.1",
    "tree-sitter-go>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
docs = ["mkdocs-material>=9.5"]
embed = ["sentence-transformers>=2.7"]
mcp = ["fastmcp>=0.2"]
vec = ["sqlite-vec>=0.1.0"]

[project.scripts]
meristem = "meristem.cli:app"
meristem-statusline = "meristem.statusline:main"

[project.urls]
Homepage = "https://github.com/kaustubhsawant-it/meristem"
Source = "https://github.com/kaustubhsawant-it/meristem"

[tool.hatch.build.targets.wheel]
packages = ["src/meristem"]
